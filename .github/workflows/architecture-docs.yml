name: Architecture Docs Package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Check npm package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run package tests
        run: npm test

      - name: Check JavaScript syntax
        run: find bin src test -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Verify CLI help
        run: node bin/architecture-docs.mjs --help

      - name: Verify npm package contents
        run: npm pack --dry-run
